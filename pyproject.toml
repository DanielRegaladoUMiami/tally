[project]
name = "tally"
version = "0.0.1"
description = "The closet that fills itself — auto-imports your clothing purchases so you see what you've spent, what your closet is worth to resell, and what's worth selling next."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Regalado" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally"]

[dependency-groups]
dev = ["ruff>=0.6", "pre-commit>=3.7", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: import from src directly so tests don't depend on the editable
# install (uv sync's editable .pth is not honored in some venvs).
pythonpath = ["src"]
